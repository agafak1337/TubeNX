    <path d="M128.00 0.00 C150.41 0.27 172.96 -0.72 195.25 2.10 C203.71 3.24 212.15 5.08 220.02 8.47 C226.12 11.10 231.83 14.75 236.53 19.47 C241.25 24.17 244.90 29.88 247.53 35.98 C250.92 43.85 252.76 52.29 253.90 60.75 C256.72 83.04 255.73 105.59 256.00 128.00 C255.73 150.41 256.72 172.96 253.90 195.25 C252.76 203.71 250.92 212.15 247.53 220.02 C244.90 226.12 241.25 231.83 236.53 236.53 C231.83 241.25 226.12 244.90 220.02 247.53 C212.15 250.92 203.71 252.76 195.25 253.90 C172.96 256.72 150.41 255.73 128.00 256.00 C105.59 255.73 83.04 256.72 60.75 253.90 C52.29 252.76 43.85 250.92 35.98 247.53 C29.88 244.90 24.17 241.25 19.47 236.53 C14.75 231.83 11.10 226.12 8.47 220.02 C5.08 212.15 3.24 203.71 2.10 195.25 C-0.72 172.96 0.27 150.41 0.00 128.00 C0.27 105.59 -0.72 83.04 2.10 60.75 C3.24 52.29 5.08 43.85 8.47 35.98 C11.10 29.88 14.75 24.17 19.47 19.47 C24.17 14.75 29.88 11.10 35.98 8.47 C43.85 5.08 52.29 3.24 60.75 2.10 C83.04 -0.72 105.59 0.27 128.00 0.00 Z" fill="url(#aurora)"/>
    <path d="M128.00 0.00 C150.41 0.27 172.96 -0.72 195.25 2.10 C203.71 3.24 212.15 5.08 220.02 8.47 C226.12 11.10 231.83 14.75 236.53 19.47 C241.25 24.17 244.90 29.88 247.53 35.98 C250.92 43.85 252.76 52.29 253.90 60.75 C256.72 83.04 255.73 105.59 256.00 128.00 C255.73 150.41 256.72 172.96 253.90 195.25 C252.76 203.71 250.92 212.15 247.53 220.02 C244.90 226.12 241.25 231.83 236.53 236.53 C231.83 241.25 226.12 244.90 220.02 247.53 C212.15 250.92 203.71 252.76 195.25 253.90 C172.96 256.72 150.41 255.73 128.00 256.00 C105.59 255.73 83.04 256.72 60.75 253.90 C52.29 252.76 43.85 250.92 35.98 247.53 C29.88 244.90 24.17 241.25 19.47 236.53 C14.75 231.83 11.10 226.12 8.47 220.02 C5.08 212.15 3.24 203.71 2.10 195.25 C-0.72 172.96 0.27 150.41 0.00 128.00 C0.27 105.59 -0.72 83.04 2.10 60.75 C3.24 52.29 5.08 43.85 8.47 35.98 C11.10 29.88 14.75 24.17 19.47 19.47 C24.17 14.75 29.88 11.10 35.98 8.47 C43.85 5.08 52.29 3.24 60.75 2.10 C83.04 -0.72 105.59 0.27 128.00 0.00 Z" fill="none" stroke="url(#rim)" stroke-width="3"/>

    <rect x="56.32" y="74.52" width="143.36" height="100.96" rx="30.29"
          fill="#FFFFFF" filter="url(#cardShadow)"/>

    <!-- play glyph: inset triangle stroked with round joins == radius 2.5 fillets -->
    <path d="M110.27 146.92 L148.23 125 L110.27 103.08 Z"
          fill="#B3261E" stroke="#B3261E" stroke-width="5"
          stroke-linejoin="round"/>

    <!-- Material You point of interest -->
    <circle cx="206" cy="201" r="13.5" fill="#FFD8E4"/>
  </g>
</svg>
