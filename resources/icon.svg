<?xml version="1.0" encoding="UTF-8"?>
<!--
  TubeNX app icon - Material 3 (Material You) squircle.

  Geometry matches tools/make_icon.py: superellipse n = 4.2 as a
  24-segment cubic path, 256x256 user units. Palette roles come from the
  light M3 scheme seeded with #FF0033:
    primary           #B3261E
    tertiary          #7D5260  (gradient far end warmed toward primary)
    primaryFixedDim   #FFB4AB  (aurora in the upper right)
    tertiaryContainer #FFD8E4  (point-of-interest dot)

  The raster version (resources/images/icon.png) is generated by the same
  script from the same layered model.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256"
     viewBox="0 0 256 256" role="img" aria-labelledby="title">
  <title id="title">TubeNX</title>
  <defs>
    <!-- tonal background: deep primary -> primary -> warm tertiary -->
    <linearGradient id="bg" gradientUnits="userSpaceOnUse"
                    x1="0" y1="256" x2="256" y2="0">
      <stop offset="0.000" stop-color="#8E1E19"/>
      <stop offset="0.125" stop-color="#931F1A"/>
      <stop offset="0.250" stop-color="#9E211B"/>
      <stop offset="0.375" stop-color="#AA241D"/>
      <stop offset="0.500" stop-color="#B2261E"/>
      <stop offset="0.625" stop-color="#B12821"/>
      <stop offset="0.750" stop-color="#AA2F31"/>
      <stop offset="0.875" stop-color="#A23743"/>
      <stop offset="1.000" stop-color="#9E3B4B"/>
    </linearGradient>

    <!-- soft "aurora" glow, upper right -->
    <radialGradient id="aurora" gradientUnits="userSpaceOnUse"
                    cx="221" cy="9" r="116"
                    gradientTransform="translate(221 9) scale(1 0.845) translate(-221 -9)">
      <stop offset="0.000" stop-color="#FFB4AB" stop-opacity="0.350"/>
      <stop offset="0.125" stop-color="#FFB4AB" stop-opacity="0.342"/>
      <stop offset="0.250" stop-color="#FFB4AB" stop-opacity="0.318"/>
      <stop offset="0.375" stop-color="#FFB4AB" stop-opacity="0.279"/>
      <stop offset="0.500" stop-color="#FFB4AB" stop-opacity="0.227"/>
      <stop offset="0.625" stop-color="#FFB4AB" stop-opacity="0.166"/>
      <stop offset="0.750" stop-color="#FFB4AB" stop-opacity="0.101"/>
      <stop offset="0.875" stop-color="#FFB4AB" stop-opacity="0.040"/>
      <stop offset="1.000" stop-color="#FFB4AB" stop-opacity="0.000"/>
    </radialGradient>

    <!-- 1.5px inner rim on the upper half -->
    <linearGradient id="rim" gradientUnits="userSpaceOnUse"
                    x1="0" y1="0" x2="0" y2="118">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- soft elevation of the white "screen" (dy 6, sigma 6.5, 22%) -->
    <filter id="cardShadow" x="-25%" y="-25%" width="150%" height="160%"
            color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="6" stdDeviation="6.5"
                    flood-color="#000000" flood-opacity="0.22"/>
    </filter>

    <clipPath id="squircle">
      <path d="M128.00 0.00 C150.41 0.27 172.96 -0.72 195.25 2.10 C203.71 3.24 212.15 5.08 220.02 8.47 C226.12 11.10 231.83 14.75 236.53 19.47 C241.25 24.17 244.90 29.88 247.53 35.98 C250.92 43.85 252.76 52.29 253.90 60.75 C256.72 83.04 255.73 105.59 256.00 128.00 C255.73 150.41 256.72 172.96 253.90 195.25 C252.76 203.71 250.92 212.15 247.53 220.02 C244.90 226.12 241.25 231.83 236.53 236.53 C231.83 241.25 226.12 244.90 220.02 247.53 C212.15 250.92 203.71 252.76 195.25 253.90 C172.96 256.72 150.41 255.73 128.00 256.00 C105.59 255.73 83.04 256.72 60.75 253.90 C52.29 252.76 43.85 250.92 35.98 247.53 C29.88 244.90 24.17 241.25 19.47 236.53 C14.75 231.83 11.10 226.12 8.47 220.02 C5.08 212.15 3.24 203.71 2.10 195.25 C-0.72 172.96 0.27 150.41 0.00 128.00 C0.27 105.59 -0.72 83.04 2.10 60.75 C3.24 52.29 5.08 43.85 8.47 35.98 C11.10 29.88 14.75 24.17 19.47 19.47 C24.17 14.75 29.88 11.10 35.98 8.47 C43.85 5.08 52.29 3.24 60.75 2.10 C83.04 -0.72 105.59 0.27 128.00 0.00 Z"/>
    </clipPath>
  </defs>

  <g clip-path="url(#squircle)">
